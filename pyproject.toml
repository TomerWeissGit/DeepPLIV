[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deeppliv"
version = "0.1.1"
description = "Neural network-based two-stage package for causal inference in partially-linear instrumental variable settings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Tomer Weiss", email = "tomer.weiss@example.com"}
]
keywords = ["causal inference", "instrumental variables", "deep learning", "partially linear models", "neural networks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=2.0.2",
    "torch>=2.5.1",
    "matplotlib>=3.9.2",
    "pandas>=2.2.3",
    "seaborn>=0.13.2",
    "scikit-learn>=1.5.2",
    "scipy>=1.13.1",
    "typing_extensions>=4.12.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
examples = [
    "optuna>=4.1.0",
    "scikit-optimize>=0.10.2",
    "statsmodels>=0.14.5",
]
aws = [
    "boto3>=1.40.18",
    "aioboto3>=7.0.0",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.1.1",
]

[project.urls]
Homepage = "https://github.com/tomerweiss/deeppliv"
Documentation = "https://github.com/tomerweiss/deeppliv#readme"
Repository = "https://github.com/tomerweiss/deeppliv"
Issues = "https://github.com/tomerweiss/deeppliv/issues"

[tool.setuptools]
packages = ["deeppliv", "deeppliv.core", "deeppliv.models", "deeppliv.data", "deeppliv.utils"]

[tool.setuptools.package-data]
deeppliv = ["py.typed"]
